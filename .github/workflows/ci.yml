name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check server.js && node --check ai.js && node --check sync.js && node --check commands.js && node --check electron/main.js && node --check public/app.js && node --check public/md.js
      - name: Smoke test
        run: npm test
