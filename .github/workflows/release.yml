name: Build installers

# Whenever main has a version in package.json that hasn't been released yet, build the
# Windows, Mac and Linux installers and publish them as a GitHub Release (tag v<version>).
# Installed copies of the app then update themselves to it.
# To release: bump "version" in package.json and push. Running this by hand from the
# Actions tab builds the installers without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; nothing to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will build and publish $TAG."
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          # No paid signing certificates: build unsigned installers
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # installers, plus the latest*.yml / .blockmap / .zip files the app's
          # auto-updater reads to find and download new versions
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Claude Code UI ${{ needs.version.outputs.tag }}
          files: installers/*
          generate_release_notes: true
